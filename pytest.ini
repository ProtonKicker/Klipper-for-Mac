[pytest]
# ---------------------------------------------------------------------------
# Klipper-for-Mac offline test suite.
#
# testpaths=tests  ->  a bare `pytest` collects exactly tests/ and nothing else.
#                      There must never be a second copy of the suite, and the
#                      stack's own klippy/moonraker trees under ~/.klipperformac
#                      must never be collected by accident.
#
# Tiers (see QA.md):
#   qa-fast  -> tests/test_*.py + tests/regress   -m "not live and not hardware"
#   qa-full  -> the ENTIRE tests/ tree            -m "not live and not hardware"
#   live     -> explicitly opt-in, never a default:  KLIPPERFORMAC_ALLOW_LIVE=1 make test-live
# ---------------------------------------------------------------------------
testpaths = tests

# `slow` is informational here: it marks tests that burn real wall-clock time
# (socket timeouts, thread joins, hypothesis sweeps). No tier filters it OUT by
# default -- qa-full runs them -- but CI on a budget can use -m "not slow".
markers =
    live: requires the RUNNING local stack (a real klipper/moonraker process, its UDS or its web ports). Never run by default. Guarded by KLIPPERFORMAC_ALLOW_LIVE=1.
    hardware: requires real hardware attached (a /dev/cu.* serial board, a camera device, TCC-granted capture). Never run by default.
    slow: takes >0.5s of real wall-clock (socket timeouts, joins, property sweeps). Included in qa-full, excludable with -m "not slow".

# Every one of these is an OFFLINE suite rule. A test that needs the live stack
# or a board MUST carry @pytest.mark.live / @pytest.mark.hardware so the gate
# can skip it; the default addopts below make "forgotten marker" a hard error
# rather than a silent hang against the user's running printer.
addopts =
    --strict-markers
    --durations-min=2.0
