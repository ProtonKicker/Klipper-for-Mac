[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".git", ".hypothesis", ".pytest_cache", ".qoder", ".ruff_cache", ".venv-test", "ui inspirations"]

[tool.ruff.lint]
# E/F = correctness + style, I = import sorting, UP = py3.10 idioms,
# B = bug-prone patterns. E501 handled by our line-length.
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP030", "UP035"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]