# ---------------------------------------------------------------------------
# Klipper-for-Mac -- tooling config.
#
# THIS FILE HOLDS LINTER CONFIG ONLY. It deliberately has no [build-system]
# and no [project] table: klipperformac is not a pip-installable package, it is
# run from the checkout via `bin/klipperformac` (see README.md). Packaging
# tooling may add [project]/[build-system] later, but MUST NOT remove the
# [tool.ruff] sections below -- `make qa-fast` and CI depend on them.
#
# pytest config lives in pytest.ini (it wins over this file for pytest).
# Dev tool deps live in requirements-dev.txt.
# ---------------------------------------------------------------------------

[tool.ruff]
# The stack targets Python 3.12 (AGENTS.md: "Python version matters: 3.12 for
# main stack"); the offline test venv happens to be newer, so pin the *lint*
# target to the oldest interpreter we support instead of the local one.
target-version = "py312"
line-length = 100

# Upstream is sacred and never ours to lint; the SwiftUI tree is Swift; the rest
# are build/venv artefacts. Keep this list in sync with .gitignore.
extend-exclude = [
    ".venv-test",
    ".venv",
    "venv",
    "upstream",
    "KlipperMac/.build",
    "KlipperMac/dist",
    "screenshots",
    "ui inspirations",
    "__pycache__",
    ".hypothesis",
    ".pytest_cache",
]

[tool.ruff.lint]
# Tiered, rust-compiler-style: E/W/F/B9 are the rules that catch real breakage
# (unused/undefined names, wrong exception chaining, syntax-level mistakes) at
# the cheapest possible cost. Anything slower/stricter is a separate opt-in.
select = ["E", "F", "B9", "W"]

# Deliberately EMPTY.
#
# The task was "ignore whatever it takes to make today's code pass". We got the
# same green result with a stricter mechanism: every existing offence is
# quarantined per FILE below, not per RULE globally. Consequences:
#   * a brand-new file under klipperformac/ is checked against all of E,F,B9,W;
#   * adding an E741 in, say, detect.py still fails the gate today;
#   * the list below can only ever SHRINK. Never add an entry to silence a
#     failure you introduced -- fix the code; if you truly must, use an inline
#     `# noqa: <code>` with a reason comment so it is attributable in the diff.
ignore = []

[tool.ruff.lint.per-file-ignores]
# ============================ BASELINE (28 findings) ========================
# Generated by `make lint-py-baseline-report` on 2026-10-15, one entry per file
# with its exact offence codes and counts. This is DEBT, not policy.
#
# E741 `l` used as a comprehension variable -- 11x -- readability only, and
# renaming it touches hot paths in cam/configgen parsers for no behaviour win.
"klipperformac/cam.py" = ["E741"]           # 8x E741
"klipperformac/configgen.py" = ["E741"]      # 2x E741
"klipperformac/tui.py" = ["E731", "E741"]    # 1x E731 lambda-assign, 1x E741
"klipperformac/proxy.py" = ["E731", "B904"]  # 1x E731 lambda-assign, 1x B904
#
# B904 `raise` inside `except` without `from` -- 11x -- the messages are already
# user-facing and self-explanatory; adding `from exc` is a cosmetic traceback
# change in installer/paths error paths we do not want to re-test blind.
"klipperformac/installer.py" = ["B904"]      # 8x B904
"klipperformac/paths.py" = ["B904"]          # 2x B904
#
# (F841 quarantine removed — see QA.md "Known baseline" for history.
# ===========================================================================

[tool.ruff.lint.pycodestyle]
max-line-length = 100
