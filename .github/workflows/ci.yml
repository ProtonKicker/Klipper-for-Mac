name: ci

on:
  push:
  pull_request:

jobs:
  qa-and-build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install shellcheck
        run: brew install shellcheck

      - name: Create QA venv
        run: python3 -m venv .venv-test

      - name: Install QA dependencies
        run: .venv-test/bin/python -m pip install -U pip && .venv-test/bin/python -m pip install -r requirements-dev.txt

      - name: Install uv (for bundled CPython runtimes)
        uses: astral-sh/setup-uv@v5

      - name: Fetch relocatable CPython runtimes
        run: ./scripts/fetch-python-runtimes.sh

      - name: Packaging contract tests
        run: .venv-test/bin/python -m pytest tests/test_gui_bundle.py -q

      - name: Run offline QA gate
        run: QA_REQUIRE_SHELLCHECK=1 sh scripts/qa/full.sh

      - name: Build macOS app + release ZIP
        working-directory: KlipperMac
        run: KLIPPERFORMAC_ZIP=1 ./build-app.sh

      - name: Verify bundled CLI, camera helper, archive and clean-PATH --help
        run: .venv-test/bin/python scripts/verify_bundle.py "KlipperMac/dist/Klipper for Mac.app"

      - uses: actions/upload-artifact@v4
        with:
          name: Klipper-for-Mac-universal.app
          path: KlipperMac/dist/Klipper for Mac.app

      - uses: actions/upload-artifact@v4
        with:
          name: Klipper-for-Mac.zip
          path: KlipperMac/dist/Klipper-for-Mac.zip
