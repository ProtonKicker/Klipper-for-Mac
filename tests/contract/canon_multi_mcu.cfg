# The canonical multi-MCU printer.cfg for the `serial --json` contract.
#
# Seven sections, chosen so ONE payload exercises every field the GUI branches
# on (the conflicts, all three identity states, and the CAN case):
#
#   [mcu]                the timing master: node attached, USB identity present
#   [mcu tool]           bound by '# klipperformac:identity', no serial written
#                        yet -> missing-port, with an identity whose present=false
#   [mcu analyser]   \
#   [mcu scanner]      / two sections, one node -> duplicate-port on both
#   [mcu camera]       a node that is not attached -> missing-port, identity null
#   [mcu rpi]          CAN: configured, claims no /dev node, no conflict
#   [mcu  board]       TWO spaces: klipper strips exactly 'mcu ' and registers
#                      this board as ' board', so its own bad header outranks
#                      its dead port -> bad-section-name, and the name keeps the
#                      space klipper gave it
#
# It is a FIXTURE, not a preset: nothing installs it, nothing boots it, and no
# test writes it anywhere except a throwaway KLIPPERFORMAC_HOME. The live facts
# it needs (which nodes are attached, what is behind them) are in
# canon_scan.json, and the bytes this config must produce are in
# serial_json.golden.
[mcu]
serial: /dev/cu.usbmodem14101
baud: 250000

[mcu tool]
# klipperformac:identity usb:1a86:7523:FFFF0001
baud: 250000

[mcu analyser]
serial: /dev/cu.usbserial-1420

[mcu scanner]
serial: /dev/cu.usbserial-1420

[mcu camera]
serial: /dev/cu.usbmodem14199

[mcu rpi]
canbus_uuid: 112233445566

[mcu  board]
serial: /dev/cu.usbmodem14198

[stepper_x]
step_pin: P2.1
enable_pin: !P2.2

[extruder]
heater_pin: tool:P2.5
